<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8"/>
        <title>Bike Scroll Showcase</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <section class="wrapper">

            <div class="card">
                <img src="https://i.pinimg.com/1200x/af/b0/b3/afb0b3b937ba354fcecf982e57dfe6fd.jpg" alt="Bike">
                <div class="content">
                    <div class="model">Yamaha R15 V4</div>
                    <div class="subtitle">Aerodynamic Supersport</div>

                    <div class="stats">
                        <div class="stat">
                            <strong>140</strong>
                            <span>km/h</span>
                        </div>
                        <div class="stat">
                            <strong>45</strong>
                            <span>km/l</span>
                        </div>
                        <div class="stat">
                            <strong>155</strong>
                            <span>kg</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="https://i.pinimg.com/736x/fe/00/c6/fe00c64d8dfcbcd42c2ef2fdf24d6b20.jpg" alt="Bike">
                <div class="content">
                    <div class="model">KTM RC 390</div>
                    <div class="subtitle">Track-Focused Precision</div>

                    <div class="stats">
                        <div class="stat">
                            <strong>170</strong>
                            <span>km/h</span>
                        </div>
                        <div class="stat">
                            <strong>30</strong>
                            <span>km/l</span>
                        </div>
                        <div class="stat">
                            <strong>172</strong>
                            <span>kg</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="https://i.pinimg.com/736x/8e/1a/28/8e1a2871eae73c0b737afb415ff5ca2c.jpg" alt="Bike">
                <div class="content">
                    <div class="model">BMW G 310 RR</div>
                    <div class="subtitle">German Engineering</div>

                    <div class="stats">
                        <div class="stat">
                            <strong>160</strong>
                            <span>km/h</span>
                        </div>
                        <div class="stat">
                            <strong>35</strong>
                            <span>km/l</span>
                        </div>
                        <div class="stat">
                            <strong>174</strong>
                            <span>kg</span>
                        </div>
                    </div>
                </div>
            </div>

        </section>

    </body>

</html>
